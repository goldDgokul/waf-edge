server {
    listen 80;
    server_name nginx-node-1;

    # 0A.10 (Option 1): WAF-block attribution variables. Dynamic rules
    # (agent-node_1/*.conf) and the static maps below SET these; the single
    # trailing return performs the actual block. Initialised to sentinels so an
    # unmatched request logs "-"/"-" and a WAF block is distinguishable from a
    # backend's own 403 in the access log.
    set $waf_blocked "0";
    set $waf_rule_id "-";
    set $waf_reason "-";

    # AI-generated WAF rules.
    #
    # There is exactly ONE rule include per node, and it is the wildcard below.
    #
    # WHY THE SECOND INCLUDE WAS REMOVED: a separate include of a generated file
    # (dynamic-node_1.conf) used to sit here. When BOTH files receive the same
    # generated batch, the same `limit_req zone=waf_dynamic burst=5 nodelay;`
    # lands twice at server scope, and nginx rejects a duplicate directive by
    # discarding EVERY rule in the file - valid ones included. Reproduced in a
    # container: [emerg] "limit_req" directive is duplicate.
    #
    # HISTORY, STATED ACCURATELY: that two-include state existed only as an
    # uncommitted local edit. No committed revision of this file ever had two
    # waf-rules includes - an earlier version of this comment implied it shipped,
    # which was wrong. The failure is real; the "it was shipped" framing was not.
    #
    # Included HERE, at server scope, because the generator emits `if (...)`
    # for url-pattern and user-agent rules and nginx does not allow `if` at
    # http scope. Including this file at http scope made the config unloadable.
    # This is also where per-tenant rules belong once each tenant has its own
    # vhost, so the include is already in the right place for multi-tenancy.
    #
    # This is a PER-NODE directory, not the shared waf-rules root. Both nodes
    # mount the same host directory, so a wildcard over the shared root made each
    # node load the OTHER node's rules - verified live. Scoping the include to a
    # directory named for this node keeps the two apart.
    #
    # Not conf.d either: that is included at http scope and the generated rules
    # contain `if`, which nginx allows only in server/location.
    include /etc/nginx/waf-rules/agent-node_1/*.conf;

# 0B.6 (ADR 0003): tenant-scoped policy for this vhost - sensitivity,
# exclusions and quotas live in THIS tenant's rules file only.
modsecurity_rules_file /etc/nginx/tenants/node1.rules;

    # Apply rate limiting
    limit_req zone=main burst=20 nodelay;
    
    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # WAF rules - block based on maps.
    # 0A.10: these now SET the attribution variables instead of returning inline,
    # so the single trailing decision point below can both block AND mark, and the
    # access log can record the rule id + reason.
    if ($block_extension) {
        set $waf_blocked "404";
        set $waf_rule_id "static_block_extension";
        set $waf_reason "block_extension";
    }
    
    if ($has_sql_injection) {
        set $waf_blocked "403";
        set $waf_rule_id "static_sql_injection";
        set $waf_reason "sql_injection";
    }
    
    if ($has_xss) {
        set $waf_blocked "403";
        set $waf_rule_id "static_xss";
        set $waf_reason "xss";
    }

    # The single block decision point. Dynamic rules and the static maps above only
    # SET $waf_blocked; this performs the return, so the block and its attribution
    # happen together.
    if ($waf_blocked = "404") { return 404; }
    if ($waf_blocked = "403") { return 403; }

    # Main application location
    location / {
        try_files $uri $uri/ =404;
    }

    # API endpoints (simulate web application)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        # 0B.2: the canned responses used to be location-level `return 200`
        # directives. nginx executes `return` in the rewrite phase, BEFORE the
        # access phase where the CRS engine's request rules run, so this whole
        # endpoint class was uninspectable (measured: /?id=1 OR 1=1 was CRS-
        # blocked 403 while /api/search?id=... bypassed at 200). The handlers
        # in /etc/nginx/api.js reproduce the identical responses in the
        # content phase, after limit_req and every ModSecurity phase.
        js_content fake.dispatch;
    }

    # Admin area (more sensitive)
    location /admin/ {
        # Stricter rate limiting for admin
        limit_req zone=main burst=5 nodelay;
        
        # Block common admin scanning paths
        location ~ /admin/(config|backup|debug) {
            return 403;
        }
        
        # 0B.2: served in the content phase via js (see /api/ above); a
        # location `return` here would equally bypass CRS inspection.
        js_content fake.admin;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
