user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format for WAF analysis.
    # `$host` is appended LAST so the positional regex in docker/log-server/app.py
    # (which ignores the trailing tail) keeps parsing; it carries the customer/
    # tenant identity (Host header) for attribution in the multi-tenant edge.
    log_format waf_format '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '$request_time $upstream_response_time '
                         '$request_length $bytes_sent $host '
                         '$waf_rule_id $waf_reason';

    # JSON log format for better parsing
    log_format json_format escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"host":"$host",'
        '"node_id":"nginx-node-1"'
    '}';

    access_log /var/log/nginx/access.log waf_format;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zones (will be updated by WAF AI)
    limit_req_zone $binary_remote_addr zone=main:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    # Zone reserved for AI-generated dynamic rate-limit rules. Generated rules
    # must not reuse `main`/`api`: the dynamic rule file is included at server
    # scope, and a second `limit_req zone=main` at that same level is a
    # duplicate directive, which makes nginx refuse to load the whole file.
    limit_req_zone $binary_remote_addr zone=waf_dynamic:10m rate=5r/s;

    # Include WAF rules generated by AI.
    # basic.conf holds `map` blocks, which are valid ONLY at http scope.
    # The dynamic rule file is NOT included here: it contains `if` directives,
    # which nginx permits only inside server/location. It is included inside the
    # server block in conf.d/default.conf instead.
    include /etc/nginx/waf-rules/basic.conf;

    # Default server
    include /etc/nginx/conf.d/*.conf;
}
