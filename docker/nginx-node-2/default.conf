server {
    listen 80;
    server_name nginx-node-2;

    # 0A.10 (Option 1): WAF-block attribution variables (see node_1 for rationale).
    set $waf_blocked "0";
    set $waf_rule_id "-";
    set $waf_reason "-";

    # AI-generated WAF rules.
    #
    # There is exactly ONE rule include per node, and it is the wildcard below.
    #
    # WHY THE SECOND INCLUDE WAS REMOVED: a separate include of a generated file
    # (dynamic-node_2.conf) used to sit here. When BOTH files receive the same
    # generated batch, the same `limit_req zone=waf_dynamic burst=5 nodelay;`
    # lands twice at server scope, and nginx rejects a duplicate directive by
    # discarding EVERY rule in the file - valid ones included. Reproduced in a
    # container: [emerg] "limit_req" directive is duplicate.
    #
    # HISTORY, STATED ACCURATELY: that two-include state existed only as an
    # uncommitted local edit. No committed revision of this file ever had two
    # waf-rules includes - an earlier version of this comment implied it shipped,
    # which was wrong. The failure is real; the "it was shipped" framing was not.
    #
    # Included HERE, at server scope, because the generator emits `if (...)`
    # for url-pattern and user-agent rules and nginx does not allow `if` at
    # http scope. Including this file at http scope made the config unloadable.
    # This is also where per-tenant rules belong once each tenant has its own
    # vhost, so the include is already in the right place for multi-tenancy.
    #
    # This is a PER-NODE directory, not the shared waf-rules root. Both nodes
    # mount the same host directory, so a wildcard over the shared root made each
    # node load the OTHER node's rules - verified live. Scoping the include to a
    # directory named for this node keeps the two apart.
    #
    # Not conf.d either: that is included at http scope and the generated rules
    # contain `if`, which nginx allows only in server/location.
    include /etc/nginx/waf-rules/agent-node_2/*.conf;

    # Apply rate limiting
    limit_req zone=main burst=20 nodelay;
    
    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # WAF rules - block based on maps.
    # 0A.10: SET the attribution variables; the single trailing decision point
    # performs the block, so the access log records the rule id + reason.
    if ($block_extension) {
        set $waf_blocked "404";
        set $waf_rule_id "static_block_extension";
        set $waf_reason "block_extension";
    }
    
    if ($has_sql_injection) {
        set $waf_blocked "403";
        set $waf_rule_id "static_sql_injection";
        set $waf_reason "sql_injection";
    }
    
    if ($has_xss) {
        set $waf_blocked "403";
        set $waf_rule_id "static_xss";
        set $waf_reason "xss";
    }

    if ($waf_blocked = "404") { return 404; }
    if ($waf_blocked = "403") { return 403; }

    # Main application location
    location / {
        try_files $uri $uri/ =404;
    }

    # Different API endpoints than node 1
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        
        # Simulate different API responses
        location = /api/products {
            return 200 '{"products": ["laptop", "phone", "tablet"]}';
            add_header Content-Type application/json;
        }
        
        location = /api/orders {
            return 200 '{"orders": [{"id": 1, "status": "shipped"}]}';
            add_header Content-Type application/json;
        }
        
        location = /api/cart {
            return 200 '{"items": 3, "total": 299.99}';
            add_header Content-Type application/json;
        }
    }

    # Different admin structure
    location /dashboard/ {
        # Stricter rate limiting for dashboard
        limit_req zone=main burst=3 nodelay;
        
        return 200 '<!DOCTYPE html><html><body><h1>Dashboard</h1><p>Node 2 Dashboard</p></body></html>';
        add_header Content-Type text/html;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
