name: WAF AI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # QUOTED: unquoted YAML reads 3.10 as the float 3.1 -> "Python 3.1 not found"
        python-version: ["3.9", "3.10", "3.11"]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test-requirements.txt
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Test with pytest
      run: |
        # 0A.7(c): -m "unit" selected ZERO tests (no test carries that marker).
        # The collection now runs clean (the 5 dead files are quarantined in
        # conftest.py collect_ignore), so run everything that does not need Docker.
        # test_ssh_activation.py is excluded here too: it is NOT docker-marked
        # (only a skipif on the docker CLI), so -m "not docker" would still select
        # it, and on a runner with Docker present its skipif does not fire and it
        # errors reaching 127.0.0.1:2222 (no live node). It needs a live SSH node.
        pytest tests/ -m "not docker" --ignore=tests/test_ssh_activation.py --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t waf-ai:test .
    
    - name: Run Docker Compose tests
      run: |
        # Start services in background
        docker-compose up -d redis
        sleep 10
        
        # Install test dependencies
        pip install -r test-requirements.txt
        
        # Run the docker-marked behavioural tests. test_ssh_activation.py needs a
        # live SSH-capable node (not provisioned in this job), so it is excluded
        # here; the throwaway-nginx-container tests in test_deploy_behaviour.py
        # run against a real `docker run` nginx and DO work in CI.
        # --no-cov: these 9 tests cannot cover 3401 statements, so the inherited
        # --cov-fail-under=30 would fail the JOB (not the tests) at ~14% coverage.
        pytest tests/ -m "docker" --ignore=tests/test_ssh_activation.py --no-cov -v --tb=short
    
    - name: Cleanup
      if: always()
      run: |
        docker-compose down -v
