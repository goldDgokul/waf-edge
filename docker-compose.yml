services:
  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: waf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Control Panel for WAF Management
  control-panel:
    build:
      context: ./docker/control-panel
      dockerfile: Dockerfile
    container_name: waf-control-panel
    ports:
      - "8090:80"
    depends_on:
      - waf-api
    restart: unless-stopped

  # WAF API Service
  waf-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waf-api
    ports:
      - "8000:8000"
    # 0A.6: the operator's own .env (gitignored) supplies optional auth
    # credentials (WAF_ADMIN_PASSWORD, WAF_JWT_SECRET). Variables absent
    # from the file are not injected, so the in-app fallbacks keep working.
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - NGINX_NODES=http://log-server-1:8080,http://log-server-2:8080
      - WAF_CORS_ORIGINS=http://localhost:3080,http://127.0.0.1:3080
      # 0A.13: SSH credentials for the real nginx nodes, so the SSH transport can
      # actually reach a node. NGINX_NODES points at the LOG servers (whose
      # hostname is wrong for SSH); this overlay supplies the real node host,
      # port, user, key and reload command. The key is mounted read-only below.
      - 'WAF_SSH_NODES=[{"node_id":"node_1","ssh_host":"nginx-node-1","ssh_port":22,"ssh_username":"root","ssh_key_path":"/app/ssh/id_ed25519","nginx_config_path":"/etc/nginx/conf.d","nginx_reload_command":"nginx -s reload"},{"node_id":"node_2","ssh_host":"nginx-node-2","ssh_port":22,"ssh_username":"root","ssh_key_path":"/app/ssh/id_ed25519","nginx_config_path":"/etc/nginx/conf.d","nginx_reload_command":"nginx -s reload"}]'
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./docker/shared/waf-rules:/app/waf-rules
      - ./docker/nginx-node-1/ssh/id_ed25519:/app/ssh/id_ed25519:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # WHY NOT curl: this check used to be ["CMD","curl","-f",...] and curl is NOT
      # installed in the api image, so the check failed with
      #   OCI runtime exec failed: exec: "curl": executable file not found in $PATH
      # on EVERY interval. The container reported `unhealthy` permanently while the API
      # served 200 the whole time (measured: a 65-failure streak on a healthy service).
      # A health indicator that is always red is worse than none: orchestration that
      # respects it would treat a working API as down, and everyone else learns to
      # ignore it - which is how a real outage gets missed later.
      # python is already in the image and its stdlib is enough, so this needs no new
      # binary in a security product's control plane.
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request,urllib.error;\ntry:\n    r=urllib.request.urlopen('http://localhost:8000/health', timeout=5)\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception as e:\n    print('health check failed:', e); sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    command: ["python", "run_server.py"]

  # Nginx Node 1 - Simulates a production web server
  nginx-node-1:
    build:
      context: ./docker/nginx-node-1
      dockerfile: Dockerfile
    container_name: nginx-node-1
    ports:
      - "8081:80"
      # Loopback-only: waf-api reaches the node over the compose network by name;
      # the host publish exists only so the local test can drive the chain via
      # 127.0.0.1:2222. Binding to loopback keeps the dev sshd off the LAN.
      - "127.0.0.1:2222:22"
    volumes:
      - ./docker/nginx-node-1/nginx.conf:/etc/nginx/templates/nginx.conf.template
      - ./docker/nginx-node-1/default.conf:/etc/nginx/conf.d/waf-node.conf
      - ./docker/nginx-node-1/api.js:/etc/nginx/api.js
      - ./docker/nginx-node-1/html:/usr/share/nginx/html
      - ./docker/nginx-node-1/logs:/var/log/nginx
      - ./docker/shared/waf-rules:/etc/nginx/waf-rules
    depends_on:
      - log-server-1
    restart: unless-stopped

  # Nginx Node 2 - Another production web server
  nginx-node-2:
    # Shares the node_1 SSH rig image: it is node-agnostic (bakes only sshd_config,
    # authorized_keys and entrypoint.sh; the nginx configs are bind-mounted below),
    # so both nodes build the identical image and the same dev key authenticates to
    # both. No separate Dockerfile/sshd_config duplication.
    build:
      context: ./docker/nginx-node-1
      dockerfile: Dockerfile
    container_name: nginx-node-2
    ports:
      - "8082:80"
      # Loopback-only, same as node_1: reachable over the compose network by name;
      # the host publish exists only for the local acceptance test (127.0.0.1:2223).
      - "127.0.0.1:2223:22"
    volumes:
      - ./docker/nginx-node-2/nginx.conf:/etc/nginx/templates/nginx.conf.template
      - ./docker/nginx-node-2/default.conf:/etc/nginx/conf.d/waf-node.conf
      # shared (node-agnostic) njs handlers; admin/dashboard are dispatched
      # by the per-node vhost
      - ./docker/nginx-node-1/api.js:/etc/nginx/api.js
      - ./docker/nginx-node-2/html:/usr/share/nginx/html
      - ./docker/nginx-node-2/logs:/var/log/nginx
      - ./docker/shared/waf-rules:/etc/nginx/waf-rules
    depends_on:
      - log-server-2
    restart: unless-stopped

  # Log server for nginx-node-1 (provides API for traffic logs)
  log-server-1:
    build:
      context: ./docker/log-server
      dockerfile: Dockerfile
    container_name: log-server-1
    ports:
      - "8080:8080"
    environment:
      - NODE_ID=nginx-node-1
      - LOG_PATH=/logs/access.log
    volumes:
      - ./docker/nginx-node-1/logs:/logs
    restart: unless-stopped

  # Log server for nginx-node-2
  log-server-2:
    build:
      context: ./docker/log-server
      dockerfile: Dockerfile
    container_name: log-server-2
    ports:
      - "8083:8080"
    environment:
      - NODE_ID=nginx-node-2
      - LOG_PATH=/logs/access.log
    volumes:
      - ./docker/nginx-node-2/logs:/logs
    restart: unless-stopped

  # Traffic Generator - Simulates real user traffic and attacks
  traffic-generator:
    build:
      context: ./docker/traffic-generator
      dockerfile: Dockerfile
    container_name: traffic-generator
    environment:
      - TARGET_NODES=http://nginx-node-1,http://nginx-node-2
      - ATTACK_PROBABILITY=0.1  # 10% of requests will be malicious
      - REQUEST_RATE=5  # requests per second
    depends_on:
      - nginx-node-1
      - nginx-node-2
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: waf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: waf-grafana
    ports:
      - "3080:3000"  # Grafana on port 3080
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=waf-admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: waf-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail for log shipping from nginx nodes
  promtail-node-1:
    image: grafana/promtail:latest
    container_name: promtail-node-1
    volumes:
      - ./docker/nginx-node-1/logs:/var/log/nginx:ro
      - ./docker/promtail/promtail-node-1.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  promtail-node-2:
    image: grafana/promtail:latest
    container_name: promtail-node-2
    volumes:
      - ./docker/nginx-node-2/logs:/var/log/nginx:ro
      - ./docker/promtail/promtail-node-2.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: waf-network
